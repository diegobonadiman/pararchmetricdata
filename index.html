<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ParARCHmetric Data</title>
<meta name="description" content="Consultoria BIM, design computacional e dados: automação em Revit, Dynamo e Python, dashboards em Power BI e coordenação BIM.">
<meta name="theme-color" content="#05070d">
<meta property="og:type" content="website">
<meta property="og:title" content="ParARCHmetric Data">
<meta property="og:description" content="Modelagem inteligente, soluções baseadas em dados. Automação BIM, dashboards e portfólio de projetos.">
<link rel="icon" href="assets/img/logo/logo-pararchmetric.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app"></div>
<noscript><p style="color:#e8edf5;font:400 16px Inter,sans-serif;padding:32px">Este site precisa de JavaScript. Contato: <a href="mailto:dxbarq@gmail.com" style="text-decoration:underline">dxbarq@gmail.com</a></p></noscript>

<!-- Modelo (template) da página: preenchido por js/app.js com os dados de js/data.js -->
<template id="site-template">
<div style="background:#05070d;color:#e8edf5;font-family:Inter,sans-serif;width:100%;overflow-x:hidden">

<header style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 32px;max-width:1240px;margin:0 auto;padding:20px 32px">
<a href="#inicio" aria-label="ParARCHmetric Data"><img src="assets/img/logo/logo-pararchmetric.png" alt="ParARCHmetric Data" style="height:84px;width:auto;display:block"></a>
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px">
<nav aria-label="Menu" style="display:flex;flex-wrap:wrap;gap:8px 28px">
<a class="nav" href="#solucoes">{{t.nav1}}</a>
<a class="nav" href="#portfolio">{{t.nav2}}</a>
<a class="nav" href="#sobre">{{t.nav3}}</a>
<a class="nav" href="#contato">{{t.nav4}}</a>
</nav>
<div role="group" aria-label="Idioma / Language" style="display:flex;border:1px solid #33405a;border-radius:8px;overflow:hidden">
<button type="button" onClick="{{setPt}}" aria-pressed="{{isPt}}" style="{{ptStyle}}">PT</button>
<button type="button" onClick="{{setEn}}" aria-pressed="{{isEn}}" style="{{enStyle}}">EN</button>
</div>
</div>
</header>

<section id="inicio" style="background:radial-gradient(circle at 80% 20%,rgba(61,143,220,.22),transparent 55%),radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px) 0 0/28px 28px;border-bottom:1px solid #151b28">
<div style="max-width:1240px;margin:0 auto;padding:96px 32px 112px;box-sizing:border-box">
<p style="margin:0 0 20px;font:600 14px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#0bb1ee">{{t.eyebrow}}</p>
<h1 style="margin:0;max-width:880px;font:500 clamp(44px,7.4vw,96px)/1.02 'Hanken Grotesk',sans-serif;letter-spacing:-.02em;color:#f2f5fa">{{t.h1}}</h1>
<p style="margin:28px 0 0;max-width:640px;font:400 19px/1.6 Inter,sans-serif;color:#aab6c9">{{t.heroSub}}</p>
<div style="margin-top:56px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;max-width:1100px">
<a class="btn" href="#solucoes"><span>{{t.cta1}}</span><span aria-hidden="true">→</span></a>
<a class="btn" href="#portfolio"><span>{{t.cta2}}</span><span aria-hidden="true">→</span></a>
<a class="btn" href="#sobre"><span>{{t.cta3}}</span></a>
</div>
</div>
</section>

<section id="solucoes" style="max-width:1240px;margin:0 auto;padding:96px 32px 40px;box-sizing:border-box">
<p style="margin:0 0 12px;font:600 13px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#0bb1ee">{{t.solEyebrow}}</p>
<h2 style="margin:0 0 16px;font:500 clamp(32px,4vw,48px)/1.1 'Hanken Grotesk',sans-serif;letter-spacing:-.01em">{{t.solTitle}}</h2>
<p style="margin:0 0 48px;max-width:680px;font:400 17px/1.6 Inter,sans-serif;color:#aab6c9">{{t.solSub}}</p>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px">
<sc-for list="{{t.sol}}" as="c" hint-placeholder-count="3">
<div style="background:#0b101a;border:1px solid #1b2333;border-radius:12px;padding:32px">
<h3 style="margin:0 0 12px;font:600 22px 'Hanken Grotesk',sans-serif">{{c.h}}</h3>
<p style="margin:0;font:400 16px/1.6 Inter,sans-serif;color:#aab6c9">{{c.p}}</p></div>
</sc-for>
</div>
<div style="margin-top:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;background:#0b101a;border:1px solid #1b2333;border-radius:12px;padding:32px">
<div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px"><span style="padding:6px 12px;border-radius:6px;background:#12315a;color:#9cc9f5;font:500 13px Inter,sans-serif">Python / pyRevit</span><span style="padding:6px 12px;border-radius:6px;background:#1b2333;color:#c3cddc;font:500 13px Inter,sans-serif">Revit 2024+</span></div>
<h3 style="margin:0 0 12px;font:600 24px 'Hanken Grotesk',sans-serif">{{t.featH}}</h3>
<p style="margin:0 0 24px;font:400 16px/1.6 Inter,sans-serif;color:#aab6c9">{{t.featP}}</p>
<div style="display:flex;gap:40px;flex-wrap:wrap"><div><div style="font:500 13px Inter,sans-serif;color:#9aa7bb">{{t.featGain}}</div><div style="font:600 22px 'Hanken Grotesk',sans-serif;color:#4ade80">{{t.featGainV}}</div></div><div><div style="font:500 13px Inter,sans-serif;color:#9aa7bb">{{t.featAud}}</div><div style="font:600 18px 'Hanken Grotesk',sans-serif">{{t.featAudV}}</div></div></div>
</div>
<div style="align-self:center;border:1px solid #1b2333;border-radius:10px;overflow:hidden;background:#000"><video autoplay="" muted="" loop="" playsinline="" controls="" preload="metadata" src="assets/video/demo-dynamo-criar-vistas-pranchas.mp4" aria-label="{{t.demoLabel}}" style="display:block;width:100%;height:auto"></video></div>
</div>
<div style="margin-top:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;background:#0b101a;border:1px solid #1b2333;border-radius:12px;padding:32px">
<div style="align-self:center;border:1px solid #1b2333;border-radius:10px;overflow:hidden;background:#000"><video autoplay="" muted="" loop="" playsinline="" controls="" preload="metadata" src="assets/video/demo-dashboard-qualidade-modelo.mp4" aria-label="{{t.dashLabel}}" style="display:block;width:100%;height:auto"></video></div>
<div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px"><span style="padding:6px 12px;border-radius:6px;background:#12315a;color:#9cc9f5;font:500 13px Inter,sans-serif">Power BI</span><span style="padding:6px 12px;border-radius:6px;background:#1b2333;color:#c3cddc;font:500 13px Inter,sans-serif">QA/QC</span></div>
<h3 style="margin:0 0 12px;font:600 24px 'Hanken Grotesk',sans-serif">{{t.dashH}}</h3>
<p style="margin:0;font:400 16px/1.6 Inter,sans-serif;color:#aab6c9">{{t.dashP}}</p>
</div>
</div>
<div id="implementacao" style="margin-top:72px;scroll-margin-top:16px;border-top:1px solid #33405a;padding-top:56px">
<p style="margin:0 0 12px;font:600 13px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#0bb1ee">{{t.impEyebrow}}</p>
<h3 style="margin:0 0 16px;max-width:820px;font:500 clamp(28px,3.6vw,42px)/1.1 'Hanken Grotesk',sans-serif;letter-spacing:-.01em">{{t.impTitle}}</h3>
<p style="margin:0 0 40px;max-width:680px;font:400 17px/1.6 Inter,sans-serif;color:#aab6c9">{{t.impSub}}</p>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-bottom:40px">
<sc-for list="{{t.impAud}}" as="a" hint-placeholder-count="3">
<div style="background:#0b101a;border:1px solid #1b2333;border-top:3px solid #3d8fdc;border-radius:12px;padding:28px"><h4 style="margin:0 0 10px;font:600 21px 'Hanken Grotesk',sans-serif">{{a.h}}</h4><p style="margin:0;font:400 15px/1.6 Inter,sans-serif;color:#aab6c9">{{a.p}}</p></div>
</sc-for>
</div>
<p style="margin:0 0 16px;font:500 13px ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:#9aa7bb">{{t.impStepsTitle}}</p>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0;border-top:1px solid #33405a;margin-bottom:40px">
<sc-for list="{{t.impSteps}}" as="st" hint-placeholder-count="4">
<div style="padding:20px 20px 20px 0;border-bottom:1px solid #1b2333"><h4 style="margin:0 0 8px;font:600 18px 'Hanken Grotesk',sans-serif">{{st.h}}</h4><p style="margin:0;font:400 14px/1.6 Inter,sans-serif;color:#aab6c9">{{st.p}}</p></div>
</sc-for>
</div>
<a href="{{t.c1href}}" style="display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;border-radius:8px;background:#3d8fdc;color:#04101e;font:600 16px Inter,sans-serif">{{t.impCta}}</a>
</div>
</section>

<section id="portfolio" style="max-width:1240px;margin:0 auto;padding:96px 32px 40px;box-sizing:border-box">
<p style="margin:0 0 12px;font:600 13px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#0bb1ee">{{t.pfEyebrow}}</p>
<h2 style="margin:0 0 16px;font:500 clamp(32px,4vw,48px)/1.1 'Hanken Grotesk',sans-serif;letter-spacing:-.01em">{{t.pfTitle}}</h2>
<p style="margin:0 0 40px;max-width:680px;font:400 17px/1.6 Inter,sans-serif;color:#aab6c9">{{t.pfSub}}</p>
<nav aria-label="Índice / Index" style="margin-bottom:56px;border-bottom:1px solid #1b2333">
<sc-for list="{{projects}}" as="p" hint-placeholder-count="7">
<a class="ix" href="#{{p.id}}"><span style="color:#0bb1ee;font-family:ui-monospace,Menlo,monospace">{{p.no}}</span><span>{{p.name}}</span><span style="color:#9aa7bb;font-size:14px">{{p.year}}</span></a>
</sc-for>
</nav>
<sc-for list="{{projects}}" as="p" hint-placeholder-count="7">
<article id="{{p.id}}" style="border-top:1px solid #33405a;padding:56px 0 72px;scroll-margin-top:16px">
<div style="display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:28px">
<div class="num">{{p.no}}</div>
<div><div style="font:500 13px ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:#0bb1ee;margin-bottom:8px">{{p.type}}</div>
<h3 style="margin:0;font:500 clamp(28px,4vw,48px)/1.05 'Hanken Grotesk',sans-serif;letter-spacing:-.01em">{{p.name}}</h3></div>
</div>
<div class="pj-grid">
<figure class="{{p.hero.cls}}" style="margin:0"><div class="{{p.hero.pl}}"><img src="{{p.hero.src}}" alt="{{p.hero.cap}}" loading="lazy"></div><figcaption class="cap">{{p.hero.cap}}</figcaption></figure>
<div class="s4">
<sc-for list="{{p.spec}}" as="r" hint-placeholder-count="5"><div class="row"><b>{{r.k}}</b><span>{{r.v}}</span></div></sc-for>
<sc-if value="{{p.hasInv}}" hint-placeholder-val="{{true}}">
<div class="row" style="display:block"><b>{{t.inv}}</b><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">
<sc-for list="{{p.inv}}" as="i" hint-placeholder-count="4"><span class="chip {{i.cls}}">{{i.label}}</span></sc-for>
</div></div>
</sc-if>
</div>
<div class="{{p.descCls}}"><p style="margin:8px 0 8px;font:400 17px/1.7 Inter,sans-serif;color:#c3cddc;max-width:760px">{{p.desc}}</p></div>
<sc-for list="{{p.figs}}" as="f" hint-placeholder-count="3">
<figure class="{{f.cls}}" style="margin:0"><div class="{{f.pl}}"><a href="{{f.src}}" target="_blank" rel="noopener" style="display:block;cursor:zoom-in"><img src="{{f.src}}" alt="{{f.cap}}" loading="lazy"></a></div><figcaption class="cap">{{f.cap}}</figcaption></figure>
</sc-for>
<sc-for list="{{p.gals}}" as="g" hint-placeholder-count="2">
<div class="s12" style="margin-top:48px">
<h4 style="margin:0 0 20px;padding-top:20px;border-top:1px solid #1b2333;font:600 22px 'Hanken Grotesk',sans-serif">{{g.title}}</h4>
<div class="pj-grid">
<sc-for list="{{g.figs}}" as="h" hint-placeholder-count="6">
<figure class="{{h.cls}}" style="margin:0"><div class="{{h.pl}}"><a href="{{h.src}}" target="_blank" rel="noopener" style="display:block;cursor:zoom-in"><img src="{{h.src}}" alt="{{h.cap}}" loading="lazy"></a></div><figcaption class="cap">{{h.cap}}</figcaption></figure>
</sc-for>
</div>
</div>
</sc-for>
</div>
</article>
</sc-for>
</section>

<section id="sobre" style="max-width:1240px;margin:0 auto;padding:96px 32px 40px;box-sizing:border-box">
<p style="margin:0 0 12px;font:600 13px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#0bb1ee">{{t.abEyebrow}}</p>
<h2 style="margin:0 0 20px;font:500 clamp(32px,4vw,48px)/1.1 'Hanken Grotesk',sans-serif;letter-spacing:-.01em">{{t.abTitle}}</h2>
<p style="margin:0 0 48px;max-width:760px;font:400 17px/1.7 Inter,sans-serif;color:#aab6c9">{{t.abP}}</p>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-bottom:40px">
<sc-for list="{{t.diffs}}" as="d" hint-placeholder-count="3">
<div style="background:#0b101a;border:1px solid #1b2333;border-radius:12px;padding:28px"><h3 style="margin:0 0 10px;font:600 20px 'Hanken Grotesk',sans-serif">{{d.h}}</h3><p style="margin:0;font:400 15px/1.6 Inter,sans-serif;color:#aab6c9">{{d.p}}</p></div>
</sc-for>
</div>
<div style="display:flex;flex-wrap:wrap;gap:10px">
<sc-for list="{{stack}}" as="s" hint-placeholder-count="9">
<span style="padding:8px 16px;border-radius:6px;background:#12315a;color:#b5d6f7;font:500 14px Inter,sans-serif">{{s}}</span>
</sc-for>
</div>
</section>

<section id="contato" style="max-width:1240px;margin:0 auto;padding:96px 32px 96px;box-sizing:border-box">
<p style="margin:0 0 12px;font:600 13px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#0bb1ee">{{t.ctEyebrow}}</p>
<h2 style="margin:0 0 40px;font:500 clamp(32px,4vw,48px)/1.1 'Hanken Grotesk',sans-serif;letter-spacing:-.01em">{{t.ctTitle}}</h2>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px">
<div style="background:#0b101a;border:1px solid #1b2333;border-radius:12px;padding:32px;display:flex;flex-direction:column;gap:20px"><h3 style="margin:0;font:600 22px 'Hanken Grotesk',sans-serif">{{t.c1h}}</h3><p style="margin:0;flex:1;font:400 16px/1.6 Inter,sans-serif;color:#aab6c9">{{t.c1p}}</p><a href="{{t.c1href}}" style="display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:8px;background:#3d8fdc;color:#04101e;font:600 16px Inter,sans-serif">{{t.c1b}}</a></div>
<div style="background:#0b101a;border:1px solid #1b2333;border-radius:12px;padding:32px;display:flex;flex-direction:column;gap:20px"><h3 style="margin:0;font:600 22px 'Hanken Grotesk',sans-serif">{{t.c2h}}</h3><p style="margin:0;flex:1;font:400 16px/1.6 Inter,sans-serif;color:#aab6c9">{{t.c2p}}</p><a href="{{t.c2href}}" style="display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:8px;background:#fcbd00;color:#1a1300;font:600 16px Inter,sans-serif">{{t.c2b}}</a></div>
<div style="background:#0b101a;border:1px solid #1b2333;border-radius:12px;padding:32px;display:flex;flex-direction:column;gap:20px"><h3 style="margin:0;font:600 22px 'Hanken Grotesk',sans-serif">{{t.c3h}}</h3><p style="margin:0;flex:1;font:400 16px/1.6 Inter,sans-serif;color:#aab6c9">{{t.c3p}}</p>
<div style="display:flex;gap:12px;flex-wrap:wrap"><a href="https://www.linkedin.com/in/diegobonadiman/" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:center;min-height:52px;padding:0 24px;border:1px solid #33405a;border-radius:8px;font:600 15px Inter,sans-serif">LinkedIn</a><a href="https://github.com/diegobonadiman/" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:center;min-height:52px;padding:0 24px;border:1px solid #33405a;border-radius:8px;font:600 15px Inter,sans-serif">GitHub</a><a href="mailto:dxbarq@gmail.com" style="display:flex;align-items:center;justify-content:center;min-height:52px;padding:0 24px;border:1px solid #33405a;border-radius:8px;font:600 15px Inter,sans-serif">E-mail</a></div></div>
</div>
</section>

<footer style="border-top:1px solid #151b28;padding:32px;text-align:center;font:400 14px Inter,sans-serif;color:#9aa7bb">© 2026 ParARCHmetric Data · Diego Bonadiman · <a href="mailto:dxbarq@gmail.com" style="text-decoration:underline">dxbarq@gmail.com</a></footer>

</div>
</template>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
